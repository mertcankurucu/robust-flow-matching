[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-fm-core"
version = "0.2.2"
description = "Core OT-FM, FM-TRS and FM-CCS experiments on 2D distributions and CIFAR-10"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "numpy>=1.23.5,<3", "scipy>=1.10",
  "scikit-learn>=1.3", "matplotlib>=3.7", "POT>=0.9",
]

[project.optional-dependencies]
cifar = ["torchvision>=0.16", "torchmetrics>=1.3,<2", "torch-fidelity>=0.3,<0.4", "torchdiffeq>=0.2.4,<0.3"]

[project.scripts]
robust-fm-2d = "robust_fm.toy.run:main"
robust-fm-figure = "robust_fm.toy.figure:main"
robust-fm-cifar10 = "robust_fm.image.run:main"
robust-fm-cifar10-label = "robust_fm.image.label.run:main"

[tool.setuptools.packages.find]
include = ["robust_fm*"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt"]
